<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#050d1a"/>
      <stop offset="100%" stop-color="#02060d"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  
  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="760" height="460" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.6"/>
  <rect x="28" y="28" width="744" height="444" rx="8" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.3" stroke-dasharray="8 4"/>

  <!-- Watermark badge -->
  <circle cx="400" cy="250" r="160" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.05"/>
  <circle cx="400" cy="250" r="120" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.05"/>

  <!-- Top Ribbon / Issuer -->
  <g transform="translate(400, 75)" text-anchor="middle">
    <text font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="4">CERTIFICATE OF COMPLETION</text>
    <text y="22" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1">DICODING INDONESIA &amp; KEMENDIKBUD</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(400, 180)" text-anchor="middle">
    <text font-family="system-ui, sans-serif" font-size="13" fill="#64748b" letter-spacing="2">THIS IS PROUDLY PRESENTED TO</text>
    <text y="38" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="1">Alvaro Raka Pratama</text>
    <line x1="-160" y1="52" x2="160" y2="52" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Specialization Title -->
  <g transform="translate(400, 280)" text-anchor="middle">
    <text font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">for successfully mastering</text>
    <text y="26" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#38bdf8">Full Stack Web Development Professional</text>
    <text y="52" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">React • Next.js • Node.js • RESTful APIs • PostgreSQL</text>
  </g>

  <!-- Bottom Details & Verification Seal -->
  <g transform="translate(80, 420)">
    <text font-family="monospace" font-size="10" fill="#475569">ID: DCD-FSW-2024-8891</text>
    <text y="16" font-family="monospace" font-size="10" fill="#475569">ISSUED: JANUARI 2024</text>
  </g>

  <!-- Official Seal -->
  <g transform="translate(700, 410)">
    <circle cx="0" cy="0" r="32" fill="#0f2444" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#fde047" stroke-width="0.8" stroke-dasharray="3 2"/>
    <text text-anchor="middle" y="4" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#fde047">VERIFIED</text>
  </g>
</svg>

