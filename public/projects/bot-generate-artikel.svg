<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="50%" stop-color="#140929"/>
      <stop offset="100%" stop-color="#06020d"/>
    </linearGradient>
    <linearGradient id="ai-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#ai-bg)"/>

  <!-- Window Chrome Header -->
  <rect x="0" y="0" width="800" height="42" fill="#0b061c" fill-opacity="0.95"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#271a45" stroke-width="1"/>
  
  <circle cx="28" cy="21" r="5" fill="#ef4444" fill-opacity="0.85"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b" fill-opacity="0.85"/>
  <circle cx="60" cy="21" r="5" fill="#10b981" fill-opacity="0.85"/>

  <rect x="250" y="10" width="300" height="22" rx="6" fill="#180e36" stroke="#2d1e52" stroke-width="0.8"/>
  <text x="400" y="25" text-anchor="middle" font-family="monospace" font-size="11" fill="#c084fc">bot-artikel.ai / studio-generator</text>

  <!-- Status Pill -->
  <g transform="translate(660, 12)">
    <rect width="115" height="19" rx="9" fill="#581c87" fill-opacity="0.5" stroke="#a855f7" stroke-width="0.8"/>
    <circle cx="12" cy="9.5" r="3.5" fill="#c084fc"/>
    <text x="24" y="13" font-family="monospace" font-size="9" font-weight="700" fill="#f3e8ff">AI ENGINE v2.4</text>
  </g>

  <!-- Left Sidebar Controls -->
  <g transform="translate(35, 65)">
    <rect width="220" height="395" rx="12" fill="#100a26" stroke="#2e1a54" stroke-width="1"/>
    
    <text x="18" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Generation Prompt</text>
    <text x="18" y="48" font-family="monospace" font-size="10" fill="#94a3b8">Keyword &amp; Tone Tuning</text>

    <!-- Keyword Box -->
    <rect x="18" y="65" width="184" height="60" rx="8" fill="#1b1138" stroke="#3b236e" stroke-width="1"/>
    <text x="28" y="85" font-family="monospace" font-size="10" fill="#e9d5ff">Topic: Modern Cyber Security</text>
    <text x="28" y="102" font-family="monospace" font-size="10" fill="#a855f7">Target SEO Score: 95+</text>
    <text x="28" y="117" font-family="monospace" font-size="9" fill="#64748b">Tone: Professional / Tech</text>

    <!-- Sliders -->
    <text x="18" y="152" font-family="monospace" font-size="10" fill="#94a3b8">CREATIVITY RATIO</text>
    <rect x="18" y="162" width="184" height="6" rx="3" fill="#24154a"/>
    <rect x="18" y="162" width="140" height="6" rx="3" fill="url(#ai-purple)"/>
    <circle cx="158" cy="165" r="5" fill="#f8fafc"/>

    <text x="18" y="192" font-family="monospace" font-size="10" fill="#94a3b8">SEMANTIC DEPTH</text>
    <rect x="18" y="202" width="184" height="6" rx="3" fill="#24154a"/>
    <rect x="18" y="202" width="165" height="6" rx="3" fill="url(#ai-purple)"/>
    <circle cx="183" cy="205" r="5" fill="#f8fafc"/>

    <!-- Key Stats -->
    <g transform="translate(18, 230)">
      <rect width="184" height="70" rx="8" fill="#180e36" stroke="#2d1e52" stroke-width="1"/>
      <text x="12" y="22" font-family="monospace" font-size="10" fill="#a855f7">OUTPUT EFFICIENCY</text>
      <text x="12" y="52" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#f8fafc">10x Flow</text>
      <text x="115" y="50" font-family="monospace" font-size="9" fill="#34d399">Automated</text>
    </g>

    <g transform="translate(18, 312)">
      <rect width="184" height="68" rx="8" fill="#180e36" stroke="#2d1e52" stroke-width="1"/>
      <text x="12" y="22" font-family="monospace" font-size="10" fill="#38bdf8">WEBHOOK DISPATCH</text>
      <text x="12" y="50" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">✓ Direct CMS Sync</text>
    </g>
  </g>

  <!-- Right Editor Preview -->
  <g transform="translate(280, 65)">
    <rect width="485" height="395" rx="12" fill="#0d0722" stroke="#2e1a54" stroke-width="1"/>

    <!-- Editor Toolbar -->
    <rect x="0" y="0" width="485" height="42" rx="12" fill="#150c33"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Semantic Article Preview: "Zero-Day Threat Defense in 2026"</text>
    <rect x="400" y="10" width="65" height="22" rx="6" fill="#a855f7" fill-opacity="0.3"/>
    <text x="432" y="25" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#e9d5ff">READY</text>

    <!-- Article Content Lines -->
    <g transform="translate(20, 60)">
      <rect width="260" height="18" rx="4" fill="#a855f7" fill-opacity="0.4"/>
      
      <rect y="32" width="445" height="8" rx="4" fill="#3b236e" fill-opacity="0.6"/>
      <rect y="48" width="420" height="8" rx="4" fill="#3b236e" fill-opacity="0.5"/>
      <rect y="64" width="435" height="8" rx="4" fill="#3b236e" fill-opacity="0.5"/>
      <rect y="80" width="280" height="8" rx="4" fill="#3b236e" fill-opacity="0.4"/>

      <!-- Subsection Box -->
      <g transform="translate(0, 105)">
        <rect width="445" height="110" rx="8" fill="#140a30" stroke="#3b236e" stroke-width="0.8"/>
        <text x="14" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#c084fc">## Section 1: AI-Powered Heuristic Detection</text>
        <rect x="14" y="38" width="417" height="6" rx="3" fill="#4c2c8f" fill-opacity="0.6"/>
        <rect x="14" y="52" width="390" height="6" rx="3" fill="#4c2c8f" fill-opacity="0.5"/>
        <rect x="14" y="66" width="405" height="6" rx="3" fill="#4c2c8f" fill-opacity="0.5"/>
        
        <rect x="14" y="84" width="85" height="16" rx="4" fill="#2e1a54"/>
        <text x="22" y="96" font-family="monospace" font-size="9" fill="#38bdf8">SEO Score: 98</text>
        <rect x="106" y="84" width="95" height="16" rx="4" fill="#2e1a54"/>
        <text x="114" y="96" font-family="monospace" font-size="9" fill="#34d399">Read Time: 4m</text>
      </g>

      <!-- Bottom Status Log -->
      <g transform="translate(0, 235)">
        <rect width="445" height="75" rx="8" fill="#170c38" stroke="#3b236e" stroke-width="0.8"/>
        <text x="14" y="22" font-family="monospace" font-size="10" fill="#94a3b8">PUBLISHING PIPELINE</text>
        <text x="14" y="44" font-family="monospace" font-size="11" fill="#34d399">● Webhook connected: https://alfari.my.id/api/posts</text>
        <text x="14" y="62" font-family="monospace" font-size="10" fill="#c084fc">⚡ Generated 1,420 words in 3.2 seconds</text>
      </g>
    </g>
  </g>

  <!-- Ambient Border -->
  <rect x="4" y="4" width="792" height="492" rx="14" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.35"/>
</svg>

