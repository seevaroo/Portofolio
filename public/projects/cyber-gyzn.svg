<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="60%" stop-color="#051026"/>
      <stop offset="100%" stop-color="#020611"/>
    </linearGradient>
    <linearGradient id="cy-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cy-radar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="cy-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#cy-bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#cy-grid)"/>

  <!-- Window Chrome Header -->
  <rect x="0" y="0" width="800" height="42" fill="#030b1e" fill-opacity="0.9"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1e293b" stroke-width="1"/>
  
  <circle cx="28" cy="21" r="5" fill="#ef4444" fill-opacity="0.85"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b" fill-opacity="0.85"/>
  <circle cx="60" cy="21" r="5" fill="#10b981" fill-opacity="0.85"/>

  <rect x="250" y="10" width="300" height="22" rx="6" fill="#09142e" stroke="#1e293b" stroke-width="0.8"/>
  <text x="400" y="25" text-anchor="middle" font-family="monospace" font-size="11" fill="#7dd3fc">cybergyzn.sec / threat-monitor</text>

  <!-- Status Pill -->
  <g transform="translate(670, 12)">
    <rect width="105" height="19" rx="9" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="0.8"/>
    <circle cx="12" cy="9.5" r="3.5" fill="#10b981"/>
    <text x="24" y="13" font-family="monospace" font-size="9" font-weight="700" fill="#34d399">DEFENSE LIVE</text>
  </g>

  <!-- Left Stats Panel -->
  <g transform="translate(35, 65)">
    <!-- Card 1: Accuracy -->
    <rect width="215" height="100" rx="12" fill="#08142c" stroke="#1e3a5f" stroke-width="1"/>
    <text x="18" y="28" font-family="monospace" font-size="10" fill="#94a3b8" letter-spacing="1">DETECTION ACCURACY</text>
    <text x="18" y="65" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#f8fafc">99.4%</text>
    <text x="18" y="86" font-family="monospace" font-size="10" fill="#10b981">▲ 0.6% vs target</text>

    <!-- Card 2: Threats Intercepted -->
    <g transform="translate(0, 115)">
      <rect width="215" height="100" rx="12" fill="#08142c" stroke="#1e3a5f" stroke-width="1"/>
      <text x="18" y="28" font-family="monospace" font-size="10" fill="#94a3b8" letter-spacing="1">THREATS INTERCEPTED</text>
      <text x="18" y="65" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#38bdf8">2,419</text>
      <text x="18" y="86" font-family="monospace" font-size="10" fill="#38bdf8">Realtime Phishing Logs</text>
    </g>

    <!-- Card 3: Model Health -->
    <g transform="translate(0, 230)">
      <rect width="215" height="150" rx="12" fill="#08142c" stroke="#1e3a5f" stroke-width="1"/>
      <text x="18" y="28" font-family="monospace" font-size="10" fill="#94a3b8" letter-spacing="1">RESPONSE TIME</text>
      <text x="18" y="60" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#34d399">12ms</text>
      
      <line x1="18" y1="80" x2="197" y2="80" stroke="#1e293b" stroke-width="1"/>
      
      <text x="18" y="102" font-family="monospace" font-size="10" fill="#94a3b8">ENGINE</text>
      <text x="197" y="102" text-anchor="end" font-family="monospace" font-size="10" font-weight="700" fill="#f8fafc">v3.8-SEC</text>

      <text x="18" y="125" font-family="monospace" font-size="10" fill="#94a3b8">DOMAINS</text>
      <text x="197" y="125" text-anchor="end" font-family="monospace" font-size="10" font-weight="700" fill="#f8fafc">14,200+</text>
    </g>
  </g>

  <!-- Right Chart & Live Stream -->
  <g transform="translate(275, 65)">
    <!-- Main Radar / Chart View -->
    <rect width="490" height="240" rx="12" fill="#061226" stroke="#1e3a5f" stroke-width="1"/>
    
    <text x="22" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Real-Time Threat Vector Analytics</text>
    <text x="22" y="47" font-family="monospace" font-size="10" fill="#64748b">Incoming URL requests analysed across 24h timeline</text>

    <!-- Grid lines -->
    <line x1="22" y1="90" x2="468" y2="90" stroke="#1e293b" stroke-dasharray="4 4"/>
    <line x1="22" y1="130" x2="468" y2="130" stroke="#1e293b" stroke-dasharray="4 4"/>
    <line x1="22" y1="170" x2="468" y2="170" stroke="#1e293b" stroke-dasharray="4 4"/>
    <line x1="22" y1="210" x2="468" y2="210" stroke="#1e293b"/>

    <!-- Wave Graph Fill & Line -->
    <path d="M 22 180 Q 75 120, 130 150 T 240 100 T 340 130 T 430 70 L 468 95 L 468 210 L 22 210 Z" fill="url(#cy-radar)"/>
    <path d="M 22 180 Q 75 120, 130 150 T 240 100 T 340 130 T 430 70 L 468 95" fill="none" stroke="url(#cy-cyan)" stroke-width="3"/>
    
    <!-- Target Blips -->
    <circle cx="240" cy="100" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="430" cy="70" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>

    <!-- Live Intercept Table -->
    <g transform="translate(0, 255)">
      <rect width="490" height="125" rx="12" fill="#061226" stroke="#1e3a5f" stroke-width="1"/>
      <text x="22" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#94a3b8">RECENT DETECTIONS</text>

      <!-- Row 1 -->
      <g transform="translate(22, 38)">
        <rect width="446" height="24" rx="4" fill="#0f1f3d" fill-opacity="0.6"/>
        <text x="12" y="16" font-family="monospace" font-size="10" fill="#f87171">BLOCKED</text>
        <text x="80" y="16" font-family="monospace" font-size="10" fill="#cbd5e1">hxxps://secure-verify-auth9.com/login</text>
        <text x="434" y="16" text-anchor="end" font-family="monospace" font-size="10" fill="#94a3b8">99.8% match</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(22, 66)">
        <rect width="446" height="24" rx="4" fill="#0f1f3d" fill-opacity="0.4"/>
        <text x="12" y="16" font-family="monospace" font-size="10" fill="#f87171">BLOCKED</text>
        <text x="80" y="16" font-family="monospace" font-size="10" fill="#cbd5e1">hxxp://account-update-bank.xyz/portal</text>
        <text x="434" y="16" text-anchor="end" font-family="monospace" font-size="10" fill="#94a3b8">98.9% match</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(22, 94)">
        <rect width="446" height="24" rx="4" fill="#0f1f3d" fill-opacity="0.2"/>
        <text x="12" y="16" font-family="monospace" font-size="10" fill="#34d399">SAFE</text>
        <text x="80" y="16" font-family="monospace" font-size="10" fill="#64748b">https://github.com/alvaroraka/cyber-gyzn</text>
        <text x="434" y="16" text-anchor="end" font-family="monospace" font-size="10" fill="#94a3b8">0.02% risk</text>
      </g>
    </g>
  </g>

  <!-- Cyber Glow Watermark Border -->
  <rect x="4" y="4" width="792" height="492" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.4"/>
</svg>

